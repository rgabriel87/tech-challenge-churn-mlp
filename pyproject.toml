[project]
name = "tech-challenge-churn-mlp"
version = "0.1.0"
description = "Tech Challenge FIAP - Churn prediction with PyTorch MLP, MLflow and FastAPI"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]