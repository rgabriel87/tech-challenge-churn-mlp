[project]
name = "tech-challenge-churn-mlp"
version = "0.1.0"
description = "Tech Challenge FIAP - Churn prediction with PyTorch MLP, MLflow and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.5.2",
    "torch==2.5.1",
    "mlflow==2.17.2",
    "fastapi==0.115.5",
    "uvicorn==0.32.0",
    "pydantic==2.9.2",
    "joblib==1.4.2",
    "pytest==8.3.3",
    "httpx==0.27.2",
    "ruff==0.7.3",
    "matplotlib==3.9.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]